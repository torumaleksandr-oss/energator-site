YAML
name: EnergaTor AI Multi-Agent System

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update-hub-windows:
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Разворачиваем код репозитория с использованием вашего секретного токена администратора
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.API_GITHUB_TOKEN }}

    # Шаг 2: Настраиваем окружение Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Шаг 3: Запускаем аналитический скрипт Агента 1
    - name: Run Industrial Analyst Agent 1
      run: node agents/agent1.js

    # Шаг 4: Отправляем изменения на сайт
    - name: Commit and Push changes to site
      run: |
        git config --global user.name "EnergaTor-AI-Agent"
        git config --global user.email "agents@energator.net"
        git add intelligence.html
        git diff-index --quiet HEAD || git commit -m "Автоматическое обновление Хаба от ИИ-Агента №1"
        git push origin main
      
