<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergaTor — Интеллектуальная Матрица Модулей</title>
    <style>
        :root {
            --space-bg: #030712;
            --copper-primary: #c87533;
            --copper-light: #ea580c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(200, 117, 51, 0.2);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--space-bg);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: var(--text-main);
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
        }

        .header {
            border-bottom: 1px solid var(--glass-border); padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(12px);
            position: relative; z-index: 10;
        }

        .header h1 { font-size: 1.4rem; margin: 0; text-transform: uppercase; letter-spacing: 3px; color: var(--copper-primary); }
        .lang-panel { display: flex; gap: 12px; }
        .lang-btn { background: transparent; border: none; color: rgba(255, 255, 255, 0.3); font-size: 0.85rem; font-weight: 700; cursor: pointer; letter-spacing: 1px; transition: all 0.3s ease; }
        .lang-btn:hover { color: var(--text-main); }
        .lang-btn.active { color: var(--copper-primary); text-shadow: 0 0 8px rgba(200, 117, 51, 0.5); }

        .matrix-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px;
            max-width: 1100px; margin: 60px auto; padding: 0 40px; box-sizing: border-box;
            height: calc(100vh - 200px); align-content: center;
        }

        .module-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 8px; padding: 30px; display: flex; flex-direction: column;
            justify-content: space-between; text-decoration: none; color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); backdrop-filter: blur(8px);
            position: relative; overflow: hidden; cursor: pointer;
        }

        .module-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(200, 117, 51, 0.1) 0%, transparent 100%);
            opacity: 0; transition: opacity 0.4s ease;
        }

        .module-card:hover {
            transform: translateY(-5px); border-color: var(--copper-primary);
            box-shadow: 0 10px 30px rgba(200, 117, 51, 0.15);
        }

        .module-card:hover::before { opacity: 1; }

        .module-num { font-size: 0.8rem; font-weight: 700; color: var(--copper-primary); letter-spacing: 2px; text-transform: uppercase; }
        .module-title { font-size: 1.2rem; font-weight: 600; margin-top: 15px; margin-bottom: 10px; line-height: 1.4; transition: color 0.3s ease; }
        .module-card:hover .module-title { color: var(--copper-primary); }
        .module-status { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-top: auto; }
    </style>
</head>
<body>

    <header class="header">
        <h1 id="mainTitle">EnergaTor — Интеллектуальная Платформа</h1>
        <nav class="lang-panel">
            <button class="lang-btn" id="btn-ua" onclick="changeLang('ua')">UA</button>
            <button class="lang-btn" id="btn-en" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" id="btn-de" onclick="changeLang('de')">DE</button>
            <button class="lang-btn" id="btn-ru" onclick="changeLang('ru')">RU</button>
        </nav>
    </header>

    <main class="matrix-container" id="matrix">
        </main>

    <script>
        const moduleLinks = {
            1: "aero.html",
            2: "transport.html",
            3: "marine.html",
            4: "grid.html",
            5: "robotics.html",
            6: "business.html",
            7: "physics.html",
            8: "analytics.html",
            9: "trends.html"
        };

        const translations = {
            ua: {
                mainTitle: "EnergaTor — Інтелектуальна Платформа",
                mod: "Модуль",
                names: {
                    1: "Авіаційні Технології (БПЛА, eVTOL)",
                    2: "Муніципальний та комерційний транспорт",
                    3: "Морські та водні системи (Порти, логістика)",
                    4: "Стаціонарна енергетика та РВЧ",
                    5: "Промисловість та Робототехніка",
                    6: "Бізнес-модель та Інвестиційні пропозиції",
                    7: "Фізика та архітектура ТПА системи",
                    8: "Глобальний аудит енергетичних дефіцитів",
                    9: "Ринкові тренди, динаміка цін та прогрес ESS"
                }
            },
            ru: {
                mainTitle: "EnergaTor — Интеллектуальная Платформа",
                mod: "Модуль",
                names: {
                    1: "Авиационные Технологии (БПЛА, eVTOL)",
                    2: "Муниципальный и коммерческий транспорт",
                    3: "Морские и водные системы (Порты, логистика)",
                    4: "Стационарная энергетика и РВЧ",
                    5: "Промышленность и Робототехника",
                    6: "Бизнес-модель и Инвестиционные предложения",
                    7: "Физика и архитектура ТПА системы",
                    8: "Глобальный аудит энергетических дефицитов",
                    9: "Рыночные тренды, динамика цен и прогрес ESS"
                }
            },
            en: {
                mainTitle: "EnergaTor — Intelligence Platform",
                mod: "Module",
                names: {
                    1: "Aviation Technologies (UAV, eVTOL)",
                    2: "Municipal & Commercial Transit Platforms",
                    3: "Marine & Aquatic Infrastructure Systems",
                    4: "Stationary Grid Power & Peak Shaving",
                    5: "Industrial Automation & Robotics",
                    6: "Business Model & Smart Money Ventures",
                    7: "PTU Core Physics & Thermal Architecture",
                    8: "Global Energy Deficit Strategic Audit",
                    9: "Market Trends, Asset Pricing & ESS Progress"
                }
            },
            de: {
                mainTitle: "EnergaTor — Intelligente Plattform",
                mod: "Modul",
                names: {
                    1: "Luftfahrttechnologien (UAV, eVTOL)",
                    2: "Kommunaler & Kommerzieller Verkehr",
                    3: "Maritime Systemlösungen & Hafenlogistik",
                    4: "Stationäre Netzenergie & Spitzenlastabdeckung",
                    5: "Industrieautomatisierung & Robotik",
                    6: "Geschäftsmodell & Smart Money Investments",
                    7: "PTU-Kernphysik & Thermodynamik",
                    8: "Globales Audit der Energiedezifite",
                    9: "Markttrends, Rohstoffpreise & ESS-Fortschritt"
                }
            }
        };

        let currentLang = localStorage.getItem('energator_lang') || 'ua';

        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('energator_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                if (btn.id === `btn-${lang}`) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const trans = translations[lang] || translations['ua'];
            document.getElementById('mainTitle').innerText = trans.mainTitle;

            const matrix = document.getElementById('matrix');
            matrix.innerHTML = "";

            for (let i = 1; i <= 9; i++) {
                const card = document.createElement('a');
                card.className = "module-card";
                card.href = moduleLinks[i];
                
                const numStr = i < 10 ? `0${i}` : i;
                
                card.innerHTML = `
                    <div class="module-num">${trans.mod} ${numStr}</div>
                    <div class="module-title">${trans.names[i]}</div>
                    <div class="module-status">System Operational</div>
                `;
                matrix.appendChild(card);
            }
        }

        changeLang(currentLang);
    </script>
</body>
</html>
