        body {

            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
        }
        h1 { color: var(--accent-color); margin: 0; font-size: 24px; }
        .lang-selector button {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 5px;
            border-radius: 4px;
        }
        .lang-selector button.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 40px;
        }
        .window-card {
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.3s;
        }
        .window-card:hover { border-color: var(--accent-color); }
        .window-card h3 { color: var(--accent-color); margin-top: 0; }
        .window-card ul { padding-left: 20px; margin: 15px 0; color: var(--muted-text); }
        .window-card ul li { margin-bottom: 8px; }
        .btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent-color);
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            color: var(--accent-color);
            font-size: 24px; cursor: pointer;
        }
        .footer-panel {
            width: 100%; max-width: 1200px;
            background: var(--panel-bg);
            border: 1px dashed var(--accent-color);
            padding: 25px; border-radius: 6px;
            text-align: center; box-sizing: border-box;
        }
    </style>
</head>

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-selector button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            
            const data = hubTranslations[lang];
            
            document.getElementById('hub-main-title').innerText = lang === 'ua' ? 'ЕнергаТор AI Аналітична Матриця' : (lang === 'ru' ? 'ЭнергаТор AI Аналитическая Матрица' : (lang === 'de' ? 'EnergaTor AI Analytische Matrix' : 'EnergaTor AI Intelligence Matrix'));
            document.getElementById('footer-title').innerText = data.bottomPanel.title;
            document.getElementById('footer-text').innerText = data.bottomPanel.text;
            document.getElementById('footer-btn').innerText = data.bottomPanel.btnText;
            
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';
            
            for(let i = 1; i <= 9; i++) {
                const winData = data[`window${i}`];
                const card = document.createElement('div');
                card.className = 'window-card';
                
                let listHtml = '<ul>';
                winData.items.forEach(item => { listHtml += `<li>${item}</li>`; });
                listHtml += '</ul>';
                
                let btnLabel = data.btnText;
                if(i === 8) btnLabel = data.btnText8;
                if(i === 9) btnLabel = data.btnText9;
                
                card.innerHTML = `
                    <div>
                        <small style="color:var(--accent-color); font-weight:bold;">${data.windowLabels[i-1]}</small>
                        <h3>${winData.title}</h3>
                        ${listHtml}
                    </div>
                    <button class="btn" onclick="openWindow(${i})">${btnLabel}</button>
                `;
                grid.appendChild(card);
            }
        }

        function openWindow(id) {
            const winData = hubTranslations[currentLang][`window${id}`];
            document.getElementById('modal-title').innerText = winData.fullTitle;
            document.getElementById('modal-text').innerText = winData.fullText;
            document.getElementById('details-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('details-modal').style.display = 'none';
        }
