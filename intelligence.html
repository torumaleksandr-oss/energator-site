<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭнергаТор — Аналитический Хаб Мультиагентной Системы</title>
    <style>
        :root {
            --space-bg: #030712;
            --copper-primary: #c87533;
            --copper-light: #ea580c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(200, 117, 51, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: var(--space-bg);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: var(--text-main);
            background: radial-gradient(circle at 50% 30%, #0f172a 0%, #030712 80%);
            background-attachment: fixed;
        }

        .header {
            border-bottom: 1px solid var(--glass-border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.6rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--copper-primary);
        }

        .btn-back {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid var(--copper-primary);
            padding: 8px 18px;
            border-radius: 4px;
            transition: all 0.3s ease;
            background: rgba(200, 117, 51, 0.05);
        }

        .btn-back:hover {
            background: var(--copper-primary);
            color: var(--space-bg);
            box-shadow: 0 0 20px rgba(200, 117, 51, 0.4);
        }

        .dashboard-container {
            max-width: 1600px;
            margin: 40px auto;
            padding: 0 30px;
            box-sizing: border-box;
        }

        /* Сетка матрицы */
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }

        .window-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer; /* Делаем всю карточку кликабельной */
        }

        .window-card:hover {
            border-color: var(--copper-primary);
            background: rgba(15, 23, 42, 0.6);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(200, 117, 51, 0.15);
        }

        .window-header {
            border-bottom: 1px solid rgba(200, 117, 51, 0.15);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-title {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .window-num {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--copper-primary);
            border: 1px solid var(--copper-primary);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .window-body ul {
            margin: 0 0 25px 0;
            padding-left: 20px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .window-body li { margin-bottom: 10px; line-height: 1.5; }

        .btn-action {
            display: block;
            text-align: center;
            background: transparent;
            border: 1.5px solid var(--copper-primary);
            color: var(--copper-primary);
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ПОЛНОЭКРАННОЕ МОДАЛЬНОЕ ОКНО ДЛЯ СТАТЕЙ И ВИДЕО */
        .fullscreen-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.95);
            z-index: 1000;
            display: none; /* Изначально скрыто */
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 60px 20px;
            box-sizing: border-box;
            backdrop-filter: blur(15px);
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--copper-primary);
            border-radius: 12px;
            max-width: 1000px;
            width: 100%;
            padding: 45px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            margin-bottom: 60px;
        }

        .modal-close {
            position: absolute;
            top: 25px;
            right: 30px;
            font-size: 2.5rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover { color: var(--copper-primary); }

        .modal-title-zone {
            border-bottom: 2px solid var(--copper-primary);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .modal-title-zone h2 {
            margin: 0;
            font-size: 2.2rem;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal-article {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--text-main);
            margin-bottom: 40px;
        }

        /* Контейнер для адаптивного видео */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Пропорции 16:9 */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            margin-top: 30px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Нижняя панель */
        .bottom-panel {
            background: linear-gradient(180deg, rgba(200, 117, 51, 0.05) 0%, rgba(200, 117, 51, 0.15) 100%);
            border: 2px solid var(--copper-primary);
            border-radius: 8px;
            padding: 35px;
            margin-top: 40px;
        }

        .panel-title { margin: 0 0 15px 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 3px; color: var(--copper-primary); }
        .panel-text { font-size: 1.1rem; line-height: 1.6; color: var(--text-main); margin-bottom: 25px; }
        .btn-panel { display: inline-block; background: var(--copper-primary); color: var(--space-bg); border: none; padding: 16px 35px; font-size: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; border-radius: 4px; transition: all 0.3s ease; }
        .btn-panel:hover { background: #ffffff; cursor: pointer; }

        @media (max-width: 1200px) { .matrix-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .matrix-grid { grid-template-columns: 1fr; }
            .modal-content { padding: 20px; }
            .modal-title-zone h2 { font-size: 1.5rem; }
        }
    </style>
</head>

            if (data) {

                card.className = 'window-card';
                // При клике на ЛЮБОЕ место карточки запускается функция открытия
                card.setAttribute('onclick', `openModal('window${i}')`);
                
                let listHtml = '';
                data.items.forEach(item => { listHtml += `<li>${item}</li>`; });

                card.innerHTML = `
                    <div>
                        <div class="window-header">

                            <span class="window-num">${data.num}</span>

                        <div class="window-body">

        // Функции модального окна
        function openModal(windowKey) {
            const data = hubData[windowKey];
            document.getElementById('mTitle').innerText = data.fullTitle;
            document.getElementById('mContent').innerText = data.fullText;
            
            const videoZone = document.getElementById('mVideoZone');
            if (data.videoUrl && data.videoUrl !== "") {
                videoZone.innerHTML = `
                    <div class="video-container">
                        <iframe src="${data.videoUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>`;
            } else {
                videoZone.innerHTML = ""; // Если видео нет, блок пустой
            }
            
            document.getElementById('infoModal').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Запрещаем прокрутку основного сайта
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
            document.getElementById('mVideoZone').innerHTML = ""; // Стопаем видео при закрытии
