<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergaTor — Интеллектуальная Матрица</title>
    <style>
        :root {
            --space-bg: #030712;
            --copper-primary: #c87533;
            --copper-light: #ea580c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(200, 117, 51, 0.35);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100%;
            background-color: var(--space-bg);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: var(--text-main);
            background: radial-gradient(circle at 50% 30%, #0f172a 0%, #030712 80%);
            background-attachment: fixed;
        }

        .header {
            border-bottom: 2px solid var(--copper-primary); padding: 25px 40px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .header h1 { 
            font-size: 1.6rem; margin: 0; text-transform: uppercase; 
            letter-spacing: 4px; color: var(--text-main);
            text-shadow: 0 0 10px rgba(200, 117, 51, 0.3);
        }
        
        .header h1 span { color: var(--copper-primary); }

        .lang-panel { display: flex; gap: 15px; }
        .lang-btn { 
            background: transparent; border: 1px solid transparent; 
            color: rgba(255, 255, 255, 0.4); font-size: 0.9rem; font-weight: 700; 
            cursor: pointer; letter-spacing: 1px; transition: all 0.3s ease;
            padding: 4px 8px; border-radius: 3px;
        }
        .lang-btn:hover { color: var(--text-main); border-color: rgba(200, 117, 51, 0.3); }
        .lang-btn.active { 
            color: var(--text-main); 
            background: rgba(200, 117, 51, 0.15);
            border-color: var(--copper-primary); 
            box-shadow: 0 0 12px rgba(200, 117, 51, 0.4); 
        }

        .matrix-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 35px;
            max-width: 1200px; margin: 60px auto; padding: 0 40px; box-sizing: border-box;
        }

        .module-card {
            background: var(--glass-bg); 
            border: 2px solid var(--glass-border);
            border-radius: 12px; padding: 35px; display: flex; flex-direction: column;
            min-height: 180px; justify-content: space-between; 
            text-decoration: none; color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .module-card:hover {
            transform: translateY(-8px); 
            border-color: var(--copper-primary);
            background: rgba(200, 117, 51, 0.05);
            box-shadow: 0 15px 35px rgba(200, 117, 51, 0.25);
        }

        .module-num { 
            font-size: 0.9rem; font-weight: 800; 
            color: var(--copper-primary); letter-spacing: 2px; 
            text-transform: uppercase; 
        }
        
        .module-title { 
            font-size: 1.3rem; font-weight: 600; margin-top: 20px; margin-bottom: 20px; 
            line-height: 1.5; transition: color 0.3s ease; color: var(--text-main);
        }
        
        .module-card:hover .module-title { color: var(--copper-primary); }
        .module-status { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
    </style>
</head>
<body>

    <header class="header">
        <h1 id="mainTitle">EnergaTor — <span>Платформа</span></h1>
        <nav class="lang-panel">
            <button class="lang-btn" id="btn-ua" onclick="changeLang('ua')">UA</button>
            <button class="lang-btn" id="btn-en" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" id="btn-de" onclick="changeLang('de')">DE</button>
            <button class="lang-btn" id="btn-ru" onclick="changeLang('ru')">RU</button>
        </nav>
    </header>

    <main class="matrix-container" id="matrix">
        </main>

    <script>
        const moduleLinks = {
            1: "aero.html",
            2: "transport.html",
            3: "marine.html",
            4: "grid.html",
            5: "robotics.html",
            6: "business.html",
            7: "physics.html",
            8: "forum.html",
            9: "lab.html"
        };

        const translations = {
            ua: {
                mainTitle: "EnergaTor — Інтелектуальна Платформа",
                mod: "Модуль",
                names: {
                    1: "Авіаційні Технології (БПЛА, eVTOL)",
                    2: "Муніципальний та комерційний транспорт",
                    3: "Морські та водні системи",
                    4: "Стаціонарна енергетика та РВЧ",
                    5: "Промисловість та Робототехніка",
                    6: "Бізнес-модель та Інвестиційні пропозиції",
                    7: "Фізика та архітектура ТПА системи",
                    8: "Балансування енергосистем",
                    9: "R&D Лабораторія та Патенти"
                }
            },
            ru: {
                mainTitle: "EnergaTor — Интеллектуальная Платформа",
                mod: "Модуль",
                names: {
                    1: "Авиационные Технологии (БПЛА, eVTOL)",
                    2: "Муниципальный и коммерческий транспорт",
                    3: "Морские и водные системы",
                    4: "Стационарная энергетика и РВЧ",
                    5: "Промышленность и Робототехника",
                    6: "Бизнес-модель и Инвестиционные предложения",
                    7: "Физика и architecture ТПА системы",
                    8: "Балансирование энергосистем",
                    9: "R&D Лаборатория и Патенты"
                }
            },
            en: {
                mainTitle: "EnergaTor — Intelligence Platform",
                mod: "Module",
                names: {
                    1: "Aviation Technologies (UAV, eVTOL)",
                    2: "Municipal & Commercial Transit",
                    3: "Marine & Aquatic Systems",
                    4: "Stationary Power & Peak Shaving",
                    5: "Industrial Automation & Robotics",
                    6: "Business Model & Investment Offers",
                    7: "PTU Core Physics & Architecture",
                    8: "Grid Balancing Systems",
                    9: "R&D Lab & Patents"
                }
            },
            de: {
                mainTitle: "EnergaTor — Intelligente Plattform",
                mod: "Modul",
                names: {
                    1: "Luftfahrttechnologien (UAV, eVTOL)",
                    2: "Kommunaler & Kommerzieller Verkehr",
                    3: "Maritime & Aquatische Systeme",
                    4: "Stationäre Netzenergie & Spitzenlast",
                    5: "Industrieautomatisierung & Robotik",
                    6: "Geschäftsmodell & Investitionsangebote",
                    7: "PTU-Kernphysik & Architektur",
                    8: "Netzbalancierungssysteme",
                    9: "R&D Labor & Patente"
                }
            }
        };

        let currentLang = localStorage.getItem('energator_lang') || 'ua';

        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('energator_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                if (btn.id === `btn-${lang}`) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const trans = translations[lang] || translations['ua'];
            document.getElementById('mainTitle').innerHTML = trans.mainTitle;

            const matrix = document.getElementById('matrix');
            matrix.innerHTML = "";

            for (let i = 1; i <= 9; i++) {
                const card = document.createElement('a');
                card.className = "module-card";
                card.href = moduleLinks[i];
                
                const numStr = i < 10 ? `0${i}` : i;
                
                card.innerHTML = `
                    <div class="module-num">${trans.mod} ${numStr}</div>
                    <div class="module-title">${trans.names[i]}</div>
                    <div class="module-status">System Operational</div>
                `;
                matrix.appendChild(card);
            }
        }

        changeLang(currentLang);
    </script>
</body>
</html>
