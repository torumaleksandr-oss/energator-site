<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭнергаТор — Аналитический Хаб Мультиагентной Системы</title>
    <style>
        :root {
            --space-bg: #030712;
            --copper-primary: #c87533;
            --copper-light: #ea580c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(200, 117, 51, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: var(--space-bg);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: var(--text-main);
            background: radial-gradient(circle at 50% 30%, #0f172a 0%, #030712 80%);
            background-attachment: fixed;
        }

        /* Шапка в стиле главной страницы */
        .header {
            border-bottom: 1px solid var(--glass-border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.6rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--copper-primary);
            text-shadow: 0 0 20px rgba(200, 117, 51, 0.3);
        }

        .btn-back {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid var(--copper-primary);
            padding: 8px 18px;
            border-radius: 4px;
            transition: all 0.3s ease;
            background: rgba(200, 117, 51, 0.05);
        }

        .btn-back:hover {
            background: var(--copper-primary);
            color: var(--space-bg);
            box-shadow: 0 0 20px rgba(200, 117, 51, 0.4);
        }

        .dashboard-container {
            max-width: 1600px;
            margin: 40px auto;
            padding: 0 30px;
            box-sizing: border-box;
        }

        /* Интерактивная матрица из 9 окон */
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }

        /* Парящие стеклянные карточки окон */
        .window-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .window-card:hover {
            border-color: var(--copper-primary);
            background: rgba(15, 23, 42, 0.6);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(200, 117, 51, 0.15);
        }

        .window-header {
            border-bottom: 1px solid rgba(200, 117, 51, 0.15);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-title {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .window-num {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--copper-primary);
            border: 1px solid var(--copper-primary);
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .window-body ul {
            margin: 0 0 25px 0;
            padding-left: 20px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .window-body li {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        /* Кнопки действий окон */
        .btn-action {
            display: block;
            text-align: center;
            background: transparent;
            border: 1.5px solid var(--copper-primary);
            color: var(--copper-primary);
            padding: 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: var(--copper-primary);
            color: var(--space-bg);
            box-shadow: 0 0 25px rgba(200, 117, 51, 0.4);
        }

        /* Нижняя стратегическая панель */
        .bottom-panel {
            background: linear-gradient(180deg, rgba(200, 117, 51, 0.05) 0%, rgba(200, 117, 51, 0.15) 100%);
            border: 2px solid var(--copper-primary);
            border-radius: 8px;
            padding: 35px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            margin-top: 40px;
        }

        .panel-title {
            margin: 0 0 15px 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--copper-primary);
            font-weight: 800;
        }

        .panel-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 25px;
        }

        .btn-panel {
            display: inline-block;
            background: var(--copper-primary);
            color: var(--space-bg);
            border: none;
            padding: 16px 35px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(200, 117, 51, 0.4);
        }

        .btn-panel:hover {
            background: #ffffff;
            color: var(--space-bg);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            cursor: pointer;
        }

        /* Адаптивность для экранов разного разрешения */
        @media (max-width: 1200px) {
            .matrix-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .matrix-grid { grid-template-columns: 1fr; }
            .header { padding: 20px; }
            .header h1 { font-size: 1.2rem; }
            .dashboard-container { padding: 0 15px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>EnergaTor Intelligence</h1>
        <a href="index.html" class="btn-back">← На главную</a>
    </header>

    <main class="dashboard-container">
        <div class="matrix-grid" id="matrixGrid"></div>

        <section class="bottom-panel" id="bottomPanel"></section>
    </main>

    <script>

         ****************************************************************************/
        const hubData = {

            window1: {

                items: [
                    "Аэротакси и тяжелые дроны.",

                    "Поиск людей и мониторинг потерянной техники."
                ],
                btnText: "Мониторинг полетов"
            },
            // Окно 2
            window2: {
                title: "Легкий и коммерческий транспорт",

                items: [
                    "Технологичные автомобили и мопеды.",

                    "Дроны для поиска и исследований подводных объектов.",
                    "Поиск затонувших кораблей и аудит коммуникаций.",
                    "Заправочные комплексы: преобразование энергии солнца, ветра и волн в СВ."

                btnText: "Аудит акваторий"

            window4: {

                ],
                btnText: "Статус систем жизнеобеспечения"
            },
            // Окно 5
            window5: {
                title: "Автономная робототехника",
                num: "Окно 5",
                items: [
                    "Складской спецтранспорт и погрузчики.",
                    "Стационарные и мобильные точки заправки СВ.",
                    "Зарядка и оперативная замена мини-АКБ для спецтранспорта.",
                    "Выделенные хабы для заправки СВ летающих дронов.",
                    "Замена мини-АКБ для дронов по пути следования заказа."
                ],
                btnText: "Статистика робототехники"
            },
            // Окно 6
            window6: {
                title: "Коммерческий сектор",
                num: "Окно 6",
                items: [

                    "Автономное энергообеспечение теплиц.",
                    "Кейс «Кафе Су-Вид» со встроенной службой доставки.",
                    "Хранение продуктов питания, холод и тепло.",
                    "Обеспечение телекоммуникаций, хранения данных, кемпингов и мотелей."
                ],
                btnText: "Карта интеграции"
            },
            // Окно 7
            window7: {
                title: "Архитектура Технологии",
                num: "Окно 7",
                items: [
                    "Неоднократное использование энергии сжатого воздуха. ТПА, рабочее давление 5 бар.",
                    "СОЖ в 800 раз плотнее воздуха — абсолютная защита ТПА от обмерзания.",
                    "Одновременная генерация: холод, тепло, электроэнергия.",

                    "Отсутствие дефицитных материалов. Взрывная, пожарная безопасность и полная вторичная переработка."
                ],
                btnText: "Технические спецификации"
            },
            // Окно 8
            window8: {
                title: "Открытая трибуна",
                num: "Окно 8",
                items: [
                    "Независимая экспертная оценка технологических параметров.",
                    "Обратная связь, отзывы партнеров и профильных инженеров.",
                    "Раздел острых вопросов, дискуссий и профессиональных мнений."
                ],
                btnText: "Принять участие в дискуссии"
            },
            // Окно 9
            window9: {
                title: "Лаборатория решений",
                num: "Окно 9",
                items: [
                    "Глобальный банк идей и модернизаций для системы TORUM.",
                    "Регистрация внешних запросов на разработку модификаций.",
                    "Сбор предложений по расширению экосистемы на новые рынки."
                ],
                btnText: "Отправить предложение"
            },
            // НИЖНЯЯ ПАНЕЛЬ
            bottomPanel: {
                title: "Патентный пул и стратегическое партнерство",
                text: "Доступ к расширенной технологической документации, архитектуре Тороидальных Преобразующих Агрегатов (ТПА) и международным патентам предоставляется авторизованным инвесторам категории «Smart Money». Действует обязательное подписание формы NDA по приоритетам развития платформы от 06.04.2026.",
                btnText: "Открыть сейф / Получить доступ к NDA"
            }
        };

        /****************************************************************************
         * СИСТЕМНЫЙ КОД (АВТОМАТИЧЕСКАЯ СБОРКА ИНТЕРФЕЙСА)
         * Этот код считывает данные из массива выше и строит страницу.
         ****************************************************************************/
        const gridContainer = document.getElementById('matrixGrid');
        
        // Генерация 9 окон
        for (let i = 1; i <= 9; i++) {
            const data = hubData[`window${i}`];
            if (data) {
                const card = document.createElement('div');
                card.className = 'window-card';
                
                let listHtml = '';
                data.items.forEach(item => {
                    listHtml += `<li>${item}</li>`;
                });

                card.innerHTML = `
                    <div>
                        <div class="window-header">
                            <h3 class="window-title">${data.title}</h3>
                            <span class="window-num">${data.num}</span>
                        </div>
                        <div class="window-body">
                            <ul>${listHtml}</ul>
                        </div>
                    </div>
                    <a href="#" class="btn-action" onclick="alert('Запуск модуля: ${data.title}'); return false;">${data.btnText}</a>
                `;
                gridContainer.appendChild(card);
            }
        }

        // Генерация нижней панели
        const panelContainer = document.getElementById('bottomPanel');
        const pData = hubData.bottomPanel;
        panelContainer.innerHTML = `
            <h2 class="panel-title">${pData.title}</h2>
            <p class="panel-text">${pData.text}</p>
            <button class="btn-panel" onclick="alert('Запрос на авторизацию NDA отправлен в патентный отдел ЭнергаТор.');">${pData.btnText}</button>
        `;
    </script>
</body>
</html>
