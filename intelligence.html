        }

        .header {

        .header-controls { display: flex; align-items: center; gap: 30px; }
        .lang-panel { display: flex; gap: 12px; }
        .lang-btn { background: transparent; border: none; color: rgba(255, 255, 255, 0.3); font-size: 0.85rem; font-weight: 700; cursor: pointer; letter-spacing: 1px; transition: all 0.3s ease; }
        .lang-btn:hover { color: var(--text-main); }
        .lang-btn.active { color: var(--copper-primary); text-shadow: 0 0 8px rgba(200, 117, 51, 0.5); }
        .btn-back { color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--copper-primary); padding: 8px 18px; border-radius: 4px; transition: all 0.3s ease; background: rgba(200, 117, 51, 0.05); }
        .btn-back:hover { background: var(--copper-primary); color: var(--space-bg); box-shadow: 0 0 20px rgba(200, 117, 51, 0.4); }

        .dashboard-container { max-width: 1600px; margin: 40px auto; padding: 0 30px; box-sizing: border-box; }
        .matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-bottom: 40px; }
        
        .window-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 8px;
            padding: 30px; display: flex; flex-direction: column; justify-content: space-between;

        .window-header { border-bottom: 1px solid rgba(200, 117, 51, 0.15); padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .window-title { margin: 0; font-size: 1.2rem; font-weight: 700; color: var(--text-main); line-height: 1.3; }
        .window-num { font-size: 0.75rem; font-weight: bold; color: var(--copper-primary); border: 1px solid var(--copper-primary); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }

        .window-body li { margin-bottom: 10px; line-height: 1.5; }
        .btn-action { display: block; text-align: center; background: transparent; border: 1.5px solid var(--copper-primary); color: var(--copper-primary); padding: 12px; border-radius: 4px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }

        .fullscreen-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;

        }
        .modal-close { position: absolute; top: 20px; right: 25px; font-size: 2.5rem; color: var(--text-muted); cursor: pointer; z-index: 10; transition: color 0.3s; }
        .modal-close:hover { color: var(--copper-primary); }
        
        .presentation-body { display: flex; width: 100%; height: 100%; }
        .pres-sidebar { width: 30%; border-right: 1px solid rgba(200, 117, 51, 0.15); background: rgba(3, 7, 18, 0.4); padding: 40px 25px; display: flex; flex-direction: column; gap: 15px; }
        .pres-main { width: 70%; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; }
        
        .step-btn {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(200, 117, 51, 0.2);
            color: var(--text-muted); padding: 15px 20px; border-radius: 6px; text-align: left;

        .pres-text-zone h2 { margin: 0 0 20px 0; color: var(--copper-primary); text-transform: uppercase; font-size: 1.4rem; letter-spacing: 1px; border-bottom: 1px solid rgba(200, 117, 51, 0.2); padding-bottom: 10px; }
        .pres-media-zone { background: #030712; border-radius: 8px; border: 1px solid rgba(200, 117, 51, 0.15); display: flex; justify-content: center; align-items: center; min-height: 350px; position: relative; overflow: hidden; }
        
        .media-placeholder { text-align: center; color: var(--text-muted); padding: 20px; font-size: 0.95rem; }
        .media-placeholder svg { width: 45px; height: 45px; fill: var(--copper-primary); margin-bottom: 15px; opacity: 0.7; }

        .bottom-panel { background: linear-gradient(180deg, rgba(200, 117, 51, 0.05) 0%, rgba(200, 117, 51, 0.15) 100%); border: 2px solid var(--copper-primary); border-radius: 8px; padding: 35px; margin-top: 40px; }
        .panel-title { margin: 0 0 15px 0; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 3px; color: var(--copper-primary); }
        .panel-text { font-size: 1.05rem; line-height: 1.6; color: var(--text-main); margin-bottom: 25px; }
        .btn-panel { display: inline-block; background: var(--copper-primary); color: var(--space-bg); border: none; padding: 16px 35px; font-size: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; border-radius: 4px; transition: all 0.3s ease; }
        .btn-panel:hover { background: #ffffff; cursor: pointer; }

        @media (max-width: 1200px) { .matrix-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 900px) {
            .presentation-body { flex-direction: column; }
            .pres-sidebar { width: 100%; height: auto; padding: 20px; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid rgba(200, 117, 51, 0.15); }
            .pres-main { width: 100%; padding: 20px; }
            .pres-grid { grid-template-columns: 1fr; }
            .modal-content { height: 95vh; }
        }
    </style>
</head>

                    title: "Комерційний & Муніципальний транспорт",
                    items: ["Повна кліматична незалежність при екстремальних температурах.", "Гібридний контур: Суперконденсатори + АКБ + буферний ТПА.", "Час відновлення енергії на маршруті в межах 3-5 хвилин."],
                    slides: [
                        { title: "Проблема: Температурна деградація міського транзиту", text: "Традиційні хімічні АКБ критично вразливі до погоди. Міський електробус при температурі нижче -15 °C миттєво втрачає до 35% номінального запасу ходу. Одночасно з цим великі об'єми енергії витрачаються на обігрів пасажирського салону. Це змушує муніципалітети ставити надлишкові, важкі батареї, що знижує корисну вантажопідйомність і збільшує навантаження на міські електромережі під час зарядки.", mediaContent: "<div class='media-placeholder'><p>[ Графік падіння ємності літій-іонних систем при мінусових температурах за даними Sustainable Bus ]</p></div>" },
                        { title: "Рішення: Гібридний буферний контур HESS", text: "Замість спроб накопичити всю енергію в хімічних елементах, транспортний модуль використовує зв'язку суперконденсаторів та легких АКБ, що постійно підживлюються від ТПА.\n\nСуперконденсатори повністю приймають на себе жорсткі пікові струми при старті важкої машини з місця та рекуперації при гальмуванні. АКБ працює в стабільному, щадному режимі низьких струмів. Енергетичне підживлення всього вузла здійснюється бортовим ТПА за рахунок каскаду балонів, що виключає перегрів і передчасний знос батарей.", mediaContent: "<div class='media-placeholder'><svg viewBox='0 0 24 24'><path d='M8 5v14l11-7z'/></svg><p>[ Відео: Принцип взаємодії ТПА з блоком суперконденсаторів на транспортній платформі ]</p></div>" },

                            </div>
                        </div>
                        <div class="btn-action">${btnLbl}</div>
                    `;
                    gridContainer.appendChild(card);
                }
            }
        }

        function renderBottomPanel() {
            const panelContainer = document.getElementById('bottomPanel');
            const trans = hubTranslations[currentLang] || hubTranslations['ua'];
            const fallbackTrans = hubTranslations['ru'] || hubTranslations['ua'];
            
            const pData = trans.bottomPanel || fallbackTrans.bottomPanel;
            panelContainer.innerHTML = `
                <h2 class="panel-title">${pData.title}</h2>
                <p class="panel-text">${pData.text}</p>
                <button class="btn-panel" onclick="alert(hubTranslations[currentLang].alertNda || fallbackTrans.bottomPanel.btnText);">${pData.btnText}</button>
            `;
        }

        function openModal(windowKey) {
            activeModalKey = windowKey;
            const trans = hubTranslations[currentLang] || hubTranslations['ua'];
            const fallbackTrans = hubTranslations['ru'] || hubTranslations['ua'];
            
            // Загружаем данные модуля (с подстраховкой из базового языка)
            const data = trans[windowKey] || hubTranslations['ru'][windowKey] || hubTranslations['ua'][windowKey];
            
            const modal = document.getElementById('infoModal');
            const sidebar = document.getElementById('presSidebar');
            
            sidebar.innerHTML = "";
            
            if (data && data.slides) {
                // Если это развернутый презентационный модуль
                const steps = trans.stepLabels && trans.stepLabels[windowKey] ? trans.stepLabels[windowKey] : fallbackTrans.stepLabels[windowKey];
                
                data.slides.forEach((slide, index) => {
                    const btn = document.createElement('button');
                    btn.className = `step-btn ${index === 0 ? 'active' : ''}`;
                    btn.innerText = steps[index];
                    btn.setAttribute('onclick', `loadSlide('${windowKey}', ${index}, this)`);
                    sidebar.appendChild(btn);
                });
                loadSlide(windowKey, 0);
            } else {
                // Если модуль пустой — берем текст из ru или ua пакета, чтобы не было пустоты на en/de
                const fallbackData = hubTranslations['ru'][windowKey] || hubTranslations['ua'][windowKey];
                sidebar.innerHTML = "<p style='color:var(--text-muted); font-size:0.9rem;'>R&D Briefing...</p>";
                document.getElementById('presTextZone').innerHTML = `<h2>${fallbackData.title}</h2><p>${fallbackData.items.join('<br><br>')}</p>`;
                document.getElementById('presMediaZone').innerHTML = "<div class='media-placeholder'><p>Презентационные материалы готовятся автором...</p></div>";
            }
            
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function loadSlide(windowKey, slideIndex, element) {
            // Строгий fallback на уровне слайдов
            const trans = hubTranslations[currentLang] || hubTranslations['ua'];
            const slideSource = trans[windowKey] && trans[windowKey].slides ? trans[windowKey] : (hubTranslations['ru'][windowKey] || hubTranslations['ua'][windowKey]);
            const slide = slideSource.slides[slideIndex];
            
            if (element) {
                document.querySelectorAll('.step-btn').forEach(btn => btn.classList.remove('active'));
                element.classList.add('active');
            }
            
            document.getElementById('presTextZone').innerHTML = `<h2>${slide.title}</h2><p style='white-space: pre-line;'>${slide.text}</p>`;
            document.getElementById('presMediaZone').innerHTML = slide.mediaContent;
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            activeModalKey = null;
        }

        changeLang(currentLang);
    </script>
</body>
</html>
