<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭнергаТор — Аналитический Хаб Мультиагентной Системы</title>
    <style>
        :root {
            --space-bg: #030712;
            --copper-primary: #c87533;
            --copper-light: #ea580c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(200, 117, 51, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: var(--space-bg);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: var(--text-main);
            background: radial-gradient(circle at 50% 30%, #0f172a 0%, #030712 80%);
            background-attachment: fixed;
        }

        .header {
            border-bottom: 1px solid var(--glass-border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header class-title h1 {
            font-size: 1.4rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--copper-primary);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .lang-panel {
            display: flex;
            gap: 12px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover { color: var(--text-main); }
        .lang-btn.active { color: var(--copper-primary); text-shadow: 0 0 8px rgba(200, 117, 51, 0.5); }

        .btn-back {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid var(--copper-primary);
            padding: 8px 18px;
            border-radius: 4px;
            transition: all 0.3s ease;
            background: rgba(200, 117, 51, 0.05);
        }

        .btn-back:hover {
            background: var(--copper-primary);
            color: var(--space-bg);
            box-shadow: 0 0 20px rgba(200, 117, 51, 0.4);
        }

        .dashboard-container {
            max-width: 1600px;
            margin: 40px auto;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }

        .window-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .window-card:hover {
            border-color: var(--copper-primary);
            background: rgba(15, 23, 42, 0.6);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(200, 117, 51, 0.15);
        }

        .window-header {
            border-bottom: 1px solid rgba(200, 117, 51, 0.15);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-title {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
        }

        .window-num {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--copper-primary);
            border: 1px solid var(--copper-primary);
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .window-body ul {
            margin: 0 0 25px 0;
            padding-left: 18px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .window-body li { margin-bottom: 10px; line-height: 1.5; }

        .btn-action {
            display: block;
            text-align: center;
            background: transparent;
            border: 1.5px solid var(--copper-primary);
            color: var(--copper-primary);
            padding: 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fullscreen-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.95);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 60px 20px;
            box-sizing: border-box;
            backdrop-filter: blur(15px);
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--copper-primary);
            border-radius: 12px;
            max-width: 1000px;
            width: 100%;
            padding: 45px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            margin-bottom: 60px;
        }

        .modal-close {
            position: absolute;
            top: 25px; right: 30px;
            font-size: 2.5rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover { color: var(--copper-primary); }

        .modal-title-zone {
            border-bottom: 2px solid var(--copper-primary);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .modal-title-zone h2 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal-article {
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-main);
            margin-bottom: 40px;
            white-space: pre-line;
        }

        .bottom-panel {
            background: linear-gradient(180deg, rgba(200, 117, 51, 0.05) 0%, rgba(200, 117, 51, 0.15) 100%);
            border: 2px solid var(--copper-primary);
            border-radius: 8px;
            padding: 35px;
            margin-top: 40px;
        }

        .panel-title { margin: 0 0 15px 0; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 3px; color: var(--copper-primary); }
        .panel-text { font-size: 1.05rem; line-height: 1.6; color: var(--text-main); margin-bottom: 25px; }
        .btn-panel { display: inline-block; background: var(--copper-primary); color: var(--space-bg); border: none; padding: 16px 35px; font-size: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; border-radius: 4px; transition: all 0.3s ease; }

        @media (max-width: 1200px) { .matrix-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .matrix-grid { grid-template-columns: 1fr; }
            .header { padding: 20px; flex-direction: column; gap: 15px; }
            .header-controls { width: 100%; justify-content: space-between; }
            .modal-content { padding: 20px; }
            .modal-title-zone h2 { font-size: 1.3rem; }
        }
    </style>
</head>

        let currentLang = localStorage.getItem('energator_lang') || 'ua';

        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('energator_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                if (btn.id === `btn-${lang}`) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const trans = hubTranslations[lang];
            document.getElementById('lnBack').innerText = trans.back;
            document.getElementById('mainTitle').innerText = trans.mainTitles[lang];
            
            renderMatrix();
            renderBottomPanel();
        }

        function renderMatrix() {
            const gridContainer = document.getElementById('matrixGrid');
            gridContainer.innerHTML = "";
            
            const trans = hubTranslations[currentLang];

            for (let i = 1; i <= 9; i++) {
                const data = trans[`window${i}`];
                if (data) {
                    const card = document.createElement('div');
                    card.className = 'window-card';
                    card.setAttribute('onclick', `openModal('window${i}')`);
                    
                    let listHtml = '';
                    data.items.forEach(item => { listHtml += `<li>${item}</li>`; });

                    let btnLbl = trans.btnText;
                    if (i === 8) btnLbl = trans.btnText8;
                    if (i === 9) btnLbl = trans.btnText9;

                    card.innerHTML = `
                        <div>
                            <div class="window-header">
                                <h3 class="window-title">${data.title}</h3>
                                <span class="window-num">${trans.windowLabels[i-1]}</span>
                            </div>
                            <div class="window-body">
                                <ul>${listHtml}</ul>
                            </div>
                        </div>
                        <div class="btn-action">${btnLbl}</div>
                    `;
                    gridContainer.appendChild(card);
                }
            }
        }

        function renderBottomPanel() {
            const panelContainer = document.getElementById('bottomPanel');
            const pData = hubTranslations[currentLang].bottomPanel;
            panelContainer.innerHTML = `
                <h2 class="panel-title">${pData.title}</h2>
                <p class="panel-text">${pData.text}</p>
                <button class="btn-panel" onclick="alert(hubTranslations[currentLang].alertNda);">${pData.btnText}</button>
            `;
        }

        function openModal(windowKey) {
            const data = hubTranslations[currentLang][windowKey];
            document.getElementById('mTitle').innerText = data.fullTitle;
            document.getElementById('mContent').innerText = data.fullText;
            document.getElementById('mVideoZone').innerHTML = "";
            document.getElementById('infoModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        changeLang(currentLang);
    </script>
</body>
</html>
