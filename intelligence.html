        .matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-bottom: 40px; }
        
        .window-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 8px;
            padding: 30px; display: flex; flex-direction: column; justify-content: space-between;

        .window-num { font-size: 0.75rem; font-weight: bold; color: var(--copper-primary); border: 1px solid var(--copper-primary); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }

        .btn-action { display: block; text-align: center; background: transparent; border: 1.5px solid var(--copper-primary); color: var(--copper-primary); padding: 12px; border-radius: 4px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s ease; }
        .window-card:hover .btn-action { background: var(--copper-primary); color: var(--space-bg); box-shadow: 0 0 15px rgba(200, 117, 51, 0.3); }

        .panel-title { margin: 0 0 15px 0; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 3px; color: var(--copper-primary); }
        .panel-text { font-size: 1.05rem; line-height: 1.6; color: var(--text-main); margin-bottom: 25px; }

        let currentLang = localStorage.getItem('energator_lang') || 'ua';

        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('energator_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                if (btn.id === `btn-${lang}`) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const trans = hubTranslations[lang] || hubTranslations['ua'];
            document.getElementById('lnBack').innerText = trans.back;
            document.getElementById('mainTitle').innerText = trans.mainTitles;
            
            renderMatrix();
            renderBottomPanel();
        }

        function renderMatrix() {
            const gridContainer = document.getElementById('matrixGrid');
            gridContainer.innerHTML = "";
            
            const trans = hubTranslations[currentLang] || hubTranslations['ua'];

            for (let i = 1; i <= 9; i++) {
                const data = trans[`window${i}`];
                if (data) {
                    // Создаем карточку как прямую ссылку на соответствующий файл html 
                    const card = document.createElement('a');
                    card.className = 'window-card';
                    card.href = moduleLinks[i]; // Ссылка берется из карты перенаправлений
                    
                    let listHtml = '';
                    data.items.forEach(item => { listHtml += `<li>${item}</li>`; });

                    let btnLbl = trans.btnText;
                    if (i === 8) btnLbl = trans.btnText8;
                    if (i === 9) btnLbl = trans.btnText9;

                    card.innerHTML = `
                        <div>
                            <div class="window-header">
                                <h3 class="window-title">${data.title}</h3>
                                <span class="window-num">${trans.windowLabels[i-1]}</span>
                            </div>
                            <div class="window-body">
                                <ul>${listHtml}</ul>
                            </div>
                        </div>
                        <div class="btn-action">${btnLbl}</div>
                    `;
                    gridContainer.appendChild(card);
                }
            }
        }

                <p class="panel-text">${pData.text}</p>
                <button class="btn-panel" onclick="event.preventDefault(); alert(hubTranslations[currentLang].alertNda);">${pData.btnText}</button>
            `;
        }

        changeLang(currentLang);
    </script>
</body>
</html>
