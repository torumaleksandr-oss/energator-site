        const gridTranslations = {
            ua: {
                back: "← В матрицю",
                titles: { main: "EnergaTor — Стаціонарна енергетика", sec1: "Дисбаланс енергосистем і потреба в буферизації", sec2: "Аналіз технологічних ніш та обмежень існуючих систем", sec3: "Наша пропозиція — локальний енергетичний комплекс «ЕнергаТор»" },
                sec1: "<p>Сучасна енергетика функціонує в умовах динамічної зміни балансу. Пікові навантаження (ранкові та вечірні максимуми) вимагають миттєвого введення резервних потужностей. З іншого боку, стрімкий розвиток відновлюваних джерел енергії (ВДЕ) створює періоди надмірного виробництва, коли мережа не здатна поглинути всю генеровану потужність без ризику порушення стабільності частоти.</p><p>Потребление енергії гарантовано зростає — цей тренд диктується тотальною електрифікацією транспорту, автоматизацією виробницб та масштабним будівництвом сучасних дата-центрів. В цих реаліях накопичувачі енергії стають не просто допоміжним елементом, а ключовим стабілізатором всієї енергетичної інфраструктури. Сучасні розподільні мережі великих міст опинилися на межі фізичної межі. Експоненціальний ріст навантажень створює локальні перевантаження, які неможливо компенсувати простим збільшенням потужності на магістральних електростанціях. Перехід до розподіленої енергетики (Distributed Generation) стає єдиним рішенням, здатним запобігти колапсу за рахунок створення незалежних локальних енергетичних вузлів безпосередньо у споживача.</p>",
                sec2: "<h3>ГАЕС (Гідроакумулюючі електростанції)</h3><p><b>Найкраще рішення для:</b> Глобального, масштабного стратегічного резервування на рівні цілих держав та енергосистем. Ідеал для згладжування базового добового графіка за рахунок оперування колосальними обсягами енергії. Мають рекордний життєвий цикл (50+ років).</p><p><b>Але обмежено:</b> Жорсткими географічними факторами. Будівництво можливе виключно в регіонах зі специфічним рельєфом (перепад висот) та водними ресурсами. Проекти вимагають величезних капітальних вкладень (CAPEX) та тривають роками.</p><h3>BESS (Хімічні акумулятори: Li-ion, LFP)</h3><p><b>Найкраще рішення для:</b> Миттєвого (мілісекундного) реагування на частотні коливання мережі та короткочасного покриття піків. Незамінний інструмент для локальних систем, де критично важливі компактність і високий КПД («туди-назад» до 90%).</p><p><b>Але обмежено:</b> Інтервалами короткострокового зберігання (ефективна межа — від 2 до 4 годин). При роботі в режимах глибокого циклічного балансування промислових мереж ячейки зазнають деградації, що обмежує їх термін служби рамками 7–10 років. Також великі масиви вимагають складних систем термостабілізації.</p><h3>Водневі енергетичні комплекси</h3><p><b>Найкраще рішення для:</b> Міжсезонного, наддовготривалого зберігання надлишків енергії на місяці вперед без саморозряду, який властивий хімічним батареям.</p><p><b>Але обмежено:</b> Низьким наскрізним КПД повного циклу преобразовання, який рідко перевищує 40–45%. Висока летючість та хімічна активність водню накладають надсуворі вимоги до матеріалів резервуарів, що робить інфраструктуру технічно складною та дорогою.</p><h3>Проточні батареї (Flow Batteries)</h3><p><b>Найкраще рішення для:</b> Стаціонарного добового резервування потужностей промислових підприємств та дата-центрів з можливістю незалежного масштабування потужності та ємності.</p><p><b>Але обмежено:</b> Габаритами та конструктивною складністю. Системи вимагають розміщення величезних резервуарів з рідким хімічним електролітом та розвиненої гідравлічної інфраструктури (насоси, арматура), що знижує загальний КПД до 65–75%.</p><h3>Традиційні системи CAES</h3><p><b>Найкраще рішення для:</b> Централізованого зберігання середньострокових запасів енергії (від 6 до 24 годин) для великих промислових вузлів з використанням підземних соляних печер.</p><p><b>Але обмежено:</b> Геолого-технічними факторами прив'язки до пустот та великими термодинамічними втратами: при стисненні повітря тепло втрачається, а при розширенні — сильно охолоджується, що вимагає спалювання газу перед турбіною для її зігріву в класичних схемах.</p>",
                sec3: "<p>На відміну від існуючих рішень, орієнтованих на виконання однієї вузької функції (накопичення енергії, генерація або забезпечення транспорту), концепція «ЕнергаТор» об'єднує ці завдання в єдиний тригенераційний енергетичний комплекс. [cite: 6]</p><p><b>Цільове призначення:</b> Концепція «ЕнергаТор» призначена для створення розподілених тригенераційних енергетичних комплексів, здатних одночасно забезпечувати об'єкти електроенергією, теплом і холодом, а також забезпечувати міський та комерційний транспорт екологічно безпечним енергоносієм. [cite: 6, 23, 24] Такі комплекси не замінюють централізовану енергетику, а доповнюють її, знижуючи пікові навантаження на розподільні мережі, підвищуючи стійкість енергопостачання та забезпечувати автономну роботу об'єктів у разі аварійних або кризових ситуацій. [cite: 18, 19, 20]</p><p><b>Можливості та баланс характеристик:</b> Архітектура «ЕнергаТор» поєднує переваги різних технологій зберігання енергії. [cite: 21, 22] Від механічних систем вона наслідує тривалий термін служби (більше 20 років без деградації накопичувача), [cite: 26] а від модульних рішень — можливість гнучкого масштабування та розміщення в безпосередній близькості від споживачів енергії, включаючи промислові підприємства, комерційні об'єкти та житлові комплекси. [cite: 4, 24]</p><p>Енергетичним ядром комплексу є тороїдальний преобразуючий агрегат (ТПА), що перетворює енергію стисненого повітря в електричну енергію. [cite: 21] Одночасно система використовує природні термодинамічні процеси: тепло, що виділяється при стисненні повітря, прямує на опалення та технологічні потреби, а холод, що виникає при його розширенні, використовується для кондиціювання приміщень, охолодження обладнання та зберігання продукції. [cite: 16, 17]</p><p>Комплексне використання всіх енергетичних потоків дозволяє істотно підвищити ефективність використання накопиченої енергії, знизити експлуатаційні витрати споживачів і перетворити локальний енергетичний комплекс на інтелектуальний буфер між об'єктом і централізованою енергосистемою. [cite: 6, 25, 26] У періоди пікового споживання такі комплекси здатні компенсувати частину навантаження на електричні мережі, підвищуючи їх стійкість і знижуючи потребу в будівництві додаткової інфраструктури. [cite: 19, 20, 26]</p>"
            },
            ru: {
                back: "← В матрицу",
                titles: { main: "EnergaTor — Стационарная энергетика", sec1: "Дисбаланс энергосистем и потребность в буферизации", sec2: "Анализ технологических ниш и ограничений существующих систем", sec3: "Наше предложение — локальный энергетический комплекс «ЭнергаТор»" },
                sec1: "<p>Современная энергетика функционирует в условиях динамического изменения баланса. Пиковые нагрузки (утренние и вечерние максимумы) требуют мгновенного ввода резервных мощностей. С другой стороны, стремительное развитие возобновляемых источников энергии (ВИЭ) создает периоды избыточного производства, когда сеть не способна поглотить всю генерируемую мощность без риска нарушения стабильности частоты.</p><p>Потребление энергии гарантированно растет — этот тренд диктуется тотальной электрификацией транспорта, автоматизацией производств и масштабным строительством современных дата-центров. В этих реалиях накопители энергии становятся не просто вспомогательным элементом, а ключевым стабилизатором всей энергетической инфраструктуры. Современные распределительные сети крупных городов оказались на грани физического предела. Экспоненциальный рост нагрузок создает локальные перегрузки, которые невозможно компенсировать простым увеличением мощности на удаленных магистральных электростанциях. Переход к распределенной энергетике (Distributed Generation) становится единственным решением, способным предотвратить коллапс за счет создания независимых локальных энергетических узлов непосредственно у потребителя.</p>",
                sec2: "<h3>ГАЭС (Гидроаккумулирующие электростанции)</h3><p><b>Лучшее решение для:</b> Глобального, масштабного стратегического резервирования на уровне целых государств и энергосистем. Идеально подходят для сглаживания базового суточного графика за счет оперирования колоссальными объемами энергии. Обладают рекордным жизненным циклом (50+ лет) и самой низкой стоимостью хранения в пересчете на десятилетия.</p><p><b>Но ограничено:</b> Жесткими географическими факторами. Строительство возможно исключительно в регионах со специфическим рельефом (значительный перепад высот) и обильными водными ресурсами. Проекты требуют огромных стартовых инвестиций (CAPEX) и длятся годами.</p><h3>BESS (Химические аккумуляторы: Li-ion, LFP)</h3><p><b>Лучшее решение для:</b> Мгновенного (миллисекундного) реагирования на частотные колебания сети и краткосрочного покрытия пиков. Литиевые накопители стали незаменимым инструментом для локальных систем, где критически важны компактность, высокая плотность энергии и высокая скорость отклика «туда-обратно» (КПД до 90%).</p><p><b>Но ограничено:</b> Интервалами краткосрочного хранения (эффективный экономический предел — от 2 до 4 часов). При работе в режимах глубокого циклического балансирования промышленных сетей химические ячейки подвержены деградации, что ограничивает их срок службы рамками 7–10 лет. Также крупные стационарные массивы требуют сложных систем термостабилизации.</p><h3>Водородные энергетические комплексы</h3><p><b>Лучшее решение для:</b> Межсезонного, сверхдолговременного хранения избытков энергии на месяцы вперед без саморазряда, который свойственен химическим батареям.</p><p><b>Но ограничено:</b> Низким сквозным КПД полного цикла преобразования, который в коммерческих системах редко превышает 40–45%. Высокая летучесть и химическая активность водорода накладывают строгие требования к материалам резервуаров, что делает инфраструктуру технически сложной и дорогостоящей.</p><h3>Проточные батареи (Flow Batteries)</h3><p><b>Лучшее решение для:</b> Стационарного суточного резервирования мощностей промышленных предприятий и дата-центров с возможностью независимого масштабирования мощности и емкости.</p><p><b>Но ограничено:</b> Габаритами и конструктивной сложностью. Системы требуют размещения огромных резервуаров с жидким химическим электролитом и развитой гидравлической инфраструктуры (насосы, арматура), что снижает общий КПД цикла до уровня 65–75%.</p><h3>Традиционные системы CAES</h3><p><b>Лучшее решение для:</b> Централизованного хранения среднесрочных запасов энергии (от 6 до 24 часов) для крупных промышленных узлов с использованием подземных соляных пещер.</p><p><b>Но ограничено:</b> Геолого-техническими факторами привязки к пустотам и большими термодинамическими потерями: при сжатии воздух сильно нагревается (тепло теряется), а при расширении — сильно охлаждается, что требует сжигания газа перед турбиной в классических схемах.</p>",
                sec3: "<p>В отличие от существующих решений, ориентированных на выполнение одной узкой функции (накопление энергии, генерация или обеспечение транспорта), концепция «ЭнергаТор» объединяет эти задачи в единый тригенерационный энергетический комплекс. [cite: 6]</p><p><b>Целевое назначение:</b> Концепция «ЭнергаТор» предназначена для создания распределённых тригенерационных энергетических комплексов, способных одновременно обеспечивать объекты электроэнергией, теплом и холодом, а также снабжать городской и коммерческий транспорт экологически безопасным энергоносителем. [cite: 6, 23, 24] Такие комплекси не заменяют централизованную энергетику, а дополняют её, снижая пиковые нагрузки на распределительные сети, повышая устойчивость энергоснабжения и обеспечивая автономную работу объектов в случае аварийных или кризисных ситуаций. [cite: 18, 19, 20]</p><p><b>Возможности и баланс характеристик:</b> Архитектура «ЭнергаТор» сочетает преимущества различных технологий хранения энергии. [cite: 21, 22] От механических систем она наследует длительный срок службы (более 20 лет без деградации накопителя), [cite: 26] а от модульных решений — возможность гибкого масштабирования и размещения в непосредственной близости от потребителей энергии, включая промышленные предприятия, коммерческие объекты и жилые комплексы. [cite: 4, 24]</p><p>Энергетическим ядром комплекса является тороидальный преобразующий агрегат (ТПА), преобразующий энергию сжатого воздуха в электрическую энергию. [cite: 21] Одновременно система использует естественные термодинамические процессы: тепло, выделяющееся при сжатии воздуха, направляется на отопление и технологические нужды, а холод, возникающий при его расширении, используется для кондиционирования помещений, охлаждения оборудования и хранения продукции. [cite: 16, 17]</p><p>Комплексное использование всех энергетических потоков позволяет существенно повысить эффективность использования накопленной энергии, снизить эксплуатационные расходы потребителей и превратить локальный энергетический комплекс в интеллектуальный буфер между объектом и централизованной энергосистемой. [cite: 6, 25, 26] В периоды пикового потребления такие комплексы способны компенсировать часть нагрузки на электрические сети, повышая их устойчивость и снижая потребность в строительстве дополнительной инфраструктуры. [cite: 19, 20, 26]</p>"
            },
            en: {
                back: "← To Matrix",
                titles: { main: "EnergaTor — Stationary Power Grid", sec1: "Grid Imbalance and Buffering Requirements", sec2: "Technological Niches and Competitor Limits", sec3: "Our Solution — EnergaTor Distributed Energy Complex" },
                sec1: "<p>Modern energy works under volatile balancing profiles. Peak demands dictate rapid reserve injections, while renewable growth drives overproduction. Consumption is expanding exponentially via transport electrification and AI datacenter buildouts. Urban distribution grids face absolute limits under these loads. Transitioning to Distributed Generation delivers the single viable escape route by deploying autonomous local energy nodes right at the client site.</p>",
                sec2: "<h3>PHS (Pumped Hydro Storage)</h3><p><b>Best for:</b> Large macro grid strategic multi-gigawatt backup. Long lifespan (50+ years).</p><p><b>Limits:</b> Strict terrain altitude demands and massive ecological footprint.</p><h3>BESS (Battery Energy Storage Systems)</h3><p><b>Best for:</b> Millisecond grid frequency stabilization and short-term peak smoothing (2–4 hours).</p><p><b>Limits:</b> Severe cell degradation within 7-10 years under grid duty and thermal runaway risks.</p><h3>Hydrogen Plants</h3><p><b>Best for:</b> Seasonal long-duration storage free from chemical self-discharge factors.</p><p><b>Limits:</b> Poor full cycle round-trip efficiency (40–45%) and high gas leakage retention costs.</p><h3>Flow Batteries</h3><p><b>Best for:</b> Fixed 24-hour industrial facility backup lines with independent power and capacity scaling.</p><p><b>Limits:</b> Heavy scale, complex hydraulic layouts, and continuous pumping losses cutting efficiency to 65–75%.</p><h3>Traditional CAES</h3><p><b>Best for:</b> Large industrial hubs using salt caverns for 6-24 hour energy cycles.</p><p><b>Limits:</b> Severe geologic site constraints and major thermal losses requiring gas combustion during expansion stages.</p>",
                sec3: "<p>Unlike existing single-purpose solutions, the EnergaTor concept integrates energy storage, generation, and vehicle refueling into one trigeneration system. [cite: 6]</p><p><b>Target Application:</b> EnergaTor builds distributed trigeneration systems supplying electricity, heat, and cooling while fueling clean transit networks. [cite: 6, 23, 24] They support centralized grids, reducing peak distribution loads and ensuring localized emergency resilience. [cite: 18, 19, 20]</p><p><b>Capabilities and Parameters:</b> The layout captures long mechanical asset lifespan (20+ years free from capacity loss) [cite: 26] combined with battery-like scalability. [cite: 4, 24] The power core relies on the PTU setup. [cite: 21] The system redirects thermodynamic compression heat to facility utilities, while expansion properties generate high-grade cooling for conditioning and industrial operations. [cite: 16, 17, 25, 26]</p>"
            },
            de: {
                back: "← Zur Matrix",
                titles: { main: "EnergaTor — Stationäre Netzenergie", sec1: "Netzimbalance und Pufferungsanforderungen", sec2: "Analyse technologischer Nischen und Grenzen bestehender Systeme", sec3: "Unser Angebot — Der dezentrale Energiekomplex EnergaTor" },
                sec1: "<p>Die moderne Energiewirtschaft operiert unter volatilen Bedingungen. Spitzenlasten erfordern sofortige Leistungsreserven, während erneuerbare Energien Überschüsse erzeugen. Der Bedarf steigt durch die Elektrifizierung des Verkehrs und KI-Rechenzentren massiv an. Städtische Verteilnetze stoßen an physische Grenzen. Der Übergang zur dezentralen Erzeugung (Distributed Generation) ist die einzige Lösung, um Netzzusammenbrüche durch lokale Knotenpunkte direkt beim Verbraucher zu verhindern.</p>",
                sec2: "<h3>Pumpspeicherkraftwerke (PSW)</h3><p><b>Beste Nische:</b> Strategische Großspeicherung für Netze. Lange Lebensdauer (50+ Jahre).</p><p><b>Grenzen:</b> Strikte geografische Anforderungen und große Flächennutzung.</p><h3>BESS (Batteriespeicher)</h3><p><b>Beste Nische:</b> Millisekundenschnelle Frequenzstabilisierung und Kurzzeit-Spitzenlastabdeckung (2–4 Std.).</p><p><b>Grenzen:</b> Schnelle Zelldegradation (7-10 Jahre bei Netznutzung) und thermische Risiken.</p><h3>Wasserstoffsysteme</h3><p><b>Beste Nische:</b> Saisonale Langzeitspeicherung ohne Selbstentladung.</p><p><b>Grenzen:</b> Niedriger Wirkungsgrad (40–45%) und komplexe Gaslagerung.</p><h3>Flow-Batterien</h3><p><b>Beste Nische:</b> Stationäre Absicherung für Industrieanlagen mit flexibler Leistungs- und Kapazitätsskalierung.</p><p><b>Grenzen:</b> Große Abmessungen, komplexe Hydraulik und kontinuierliche Pumpverluste (Wirkungsgrad 65–75%).</p><h3>Klassische CAES</h3><p><b>Beste Nische:</b> Zentrale Speicherung (6-24 Std.) für Industriezentren mittels Salzkavernen.</p><p><b>Grenzen:</b> Strikte geologische Bedingungen und hohe thermische Verluste bei der Luftkompression.</p>",
                sec3: "<p>Im Gegensatz zu Einzelfunktionssystemen verbindet EnergaTor Speicherung, Erzeugung und Verkehrsinfrastruktur in einem Trigenerationskomplex. [cite: 6]</p><p><b>Einsatzbereich:</b> EnergaTor dient dem Aufbau dezentraler Netze für Strom, Wärme und Kälte. [cite: 6, 23, 24] Sie ergänzen das Zentralnetz, entlasten Verteilnetze in Spitzenzeiten und sichern den autonomen Betrieb bei Krisen. [cite: 18, 19, 20]</p><p><b>Eigenschaften:</b> Die Architektur bietet mechanische Langlebigkeit (20+ Jahre ohne Kapazitätsverlust) [cite: 26] gepaart mit modularer Skalierbarkeit. [cite: 4, 24] Das Herzstück ist die PTU-Einheit. [cite: 21] Kompressionswärme heizt Gebäude, während Expansionskälte zur Klimatisierung und Kühlung genutzt wird. [cite: 16, 17, 25, 26]</p>"
            }
        };
