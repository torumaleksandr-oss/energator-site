    <script>
        const aeroTranslations = {
            ua: {
                back: "← В матрицю",
                titles: { main: "EnergaTor — Авіаційні Технології", sec1: "Експлуатаційний тупик Lithium-ion систем у БПЛА", sec2: "Порівняльний аналіз параметрів бортових енергосистем", sec3: "Інженерне рішення ЕнергаТор: Полегшений борт з ТПА-підживленням" },
                table: {
                    headers: ["Параметр ефективності", "Стандартний Lithium-ion борт", "Борт з інтегрованим ТПА EnergaTor"],
                    rows: [
                        ["Питома вага енерговузла", "До 35-45% від маси всього порожнього дрона", "Мінімальна (вага АКБ знижена в кілька разів)"],
                        ["Час відновлення енергії", "Від 1 до 4 годин безперервного простою біля розетки", "3–5 хвилин (швидка заправка стисненим повітрям)"],
                        ["Ресурс бортового накопичувача", "Всього 300–400 циклів через високі пускові струми", "Понад 20 років експлуатації механічних каскадів"],
                        ["Робота при температурах нижче -15 °C", "Критична втрата до 35% ємності та падіння потужності", "Стабільна робота завдяки СОЖ-термостабілізації"]
                    ]
                },
                sec1: "<p>Сучасна індустрія промислових безпілотників та аеротаксі (eVTOL) уперлася в жорсткий фізичний ліміт хімічних джерел живлення. Чим важчий дрон і чим більшу корисну вантажопідйомність він заявляє, тим масивніший акумуляторний блок інженери змушені ставити на борт. В результаті виникає парадокс: важкий промисловий безпілотник витрачає більшу частину енергії просто на переміщення ваги власної батареї, обмежуючи час польоту короткими інтервалами у 10–20 мінут.</p><p>Висока ціна акумуляторів, яка становить до половини вартості всього літального апарату, у поєднанні з тривалим часом простою під час заряджання повністю руйнує комерційну окупність логістичних та пошукових хабів.</p>",
                sec3: "<p><b>Оптимізація ваги та безперервний цикл роботи:</b> Концепція «ЕнергаТор» повністю переформатує бортову енергомережу важких БПЛА. Замість спроб крутити гвинти виключно за рахунок стисненого повітря або використання надлишкових літієвих касет, система реалізує принцип буферного підживлення.</p><p>З борту дрона повністю видаляється важка основна АКБ. Замість неї встановлюється зменшена, полегшена акумуляторна батарея, здатна видавати необхідну потужність на мотори. Під час усього польоту бортовий тороїдальний преобразуючий агрегат (ТПА) здійснює безперервне підживлення цього зменшеного накопичувача за рахунок енергії стисненого повітря з балонів, стабілізованих системою теплообмінників.</p><p>В результаті зменшена АКБ не розряджається в нуль під час місії. Після приземлення дрону не потрібне багатогодинне заряджання від мережі: оператор здійснює заправку балонів стисненим повітрям за 3–5 хвилин через швидкороз'ємні з'єднання, і полегшений апарат миттєво повертається на робочий маршрут.</p>"
            },
            ru: {
                back: "← В матрицу",
                titles: { main: "EnergaTor — Авиационные Технологии", sec1: "Эксплуатационный тупик Lithium-ion систем в БПЛА", sec2: "Сравнительный анализ параметров бортовых энергосистем", sec3: "Инженерное решение ЭнергаТор: Облегченный борт с ТПА-подпиткой" },
                table: {
                    headers: ["Параметр эффективности", "Стандартный Lithium-ion борт", "Борт с информацией ТПА EnergaTor"],
                    rows: [
                        ["Удельный вес энергоузла", "До 35-45% от массы всего пустого дрона", "Минимальный (вес АКБ снижен в несколько раз)"],
                        ["Время восстановления энергии", "От 1 до 4 часов непрерывного простоя у розетки", "3–5 минут (быстрая заправка сжатым воздухом)"],
                        ["Ресурс бортового накопителя", "Всего 300–400 циклов из-за высоких пусковых токов", "Более 20 лет эксплуатации механических каскадов"],
                        ["Работа при температурах ниже -15 °C", "Критическая потеря до 35% емкости и падение мощности", "Стабильная работа благодаря СОЖ-термостабилизации"]
                    ]
                },
                sec1: "<p>Современная индустрия промышленных беспилотников и аэротакси (eVTOL) уперлась в жесткий physicalеский лимит химических источников питания. Чем тяжелее дрон и чем большую полезную грузоподъемность он заявляет, тем более массивный аккумуляторный блок инженеры вынуждены ставить на борт. В результате возникает парадокс: тяжелый промышленный беспилотник расходует большую часть энергии просто на перемещение веса собственной батареи, ограничивая время полета короткими интервалами в 10–20 минут.</p><p>Высокая цена аккумуляторов, составляющая до половины стоимости всего летательного аппарата, в сочетании с длительным временем простоя при зарядке полностью разрушает коммерческую окупаемость логистических и поисковых хабов.</p>",
                sec3: "<p><b>Оптимизация веса и непрерывный цикл работы:</b> Концепция «ЕнергаТор» полностью переформатирует бортовую энергосеть тяжелых БПЛА. Вместо попыток крутить винты исключительно за счет сжатого воздуха или использования избыточных литиевых кассет, система реализует принцип буферной подпитки.</p><p>С борта дрона полностью удаляется тяжелая основная АКБ. Вместо нее устанавливается уменьшенная, облегченная аккумуляторная батарея, способная выдавать необходимую мощность на моторы. Во время всего полета бортовой тороидальный преобразующий агрегат (ТПА) осуществляет непрерывную подпитку этого уменьшенного накопителя за счет энергии сжатого воздуха из баллонов, стабилизированных системой теплообменников.</p><p>В результате уменьшенная АКБ не разряжается в ноль во время миссии. После приземления дрону не требуется многочасовая зарядка от сети: оператор производит заправку баллонов сжатым воздухом за 3–5 минут через быстроразъемные соединения, и облегченный аппарат мгновенно возвращается на рабочий маршрут.</p>"
            },
            en: {
                back: "← To Matrix",
                titles: { main: "EnergaTor — Aviation Technologies", sec1: "Operational Bottleneck of Lithium-ion Systems in UAVs", sec2: "Comparative Analysis of Airborne Energy Systems", sec3: "EnergaTor Engineering Solution: Lightweight Frame with PTU-Buffering" },
                table: {
                    headers: ["Efficiency Parameter", "Standard Lithium-ion Frame", "Integrated EnergaTor PTU Frame"],
                    rows: [
                        ["Energy Pack Weight Ratio", "Up to 35-45% of total empty drone weight mass", "Minimal (battery weight slashed several-fold)"],
                        ["Energy Restoration Downtime", "From 1 to 4 hours of continuous plug-in dependency", "3–5 minutes (rapid compressed air refueling)"],
                        ["Onboard Storage Lifespan", "Mere 300–400 cycles due to heavy peak discharge stresses", "20+ years of operational mechanical cascade lifespan"],
                        ["Sub -15 °C Weather Performance", "Critical loss of up to 35% nominal capacity & power", "Stable operations secured by cooling fluid thermal buffering"]
                    ]
                },
                sec1: "<p>The modern industrial drone and eVTOL industry has hit a strict physical boundary imposed by chemical power sources. As drone frames grow heavier to support serious industrial payloads, engineers are forced to step up battery mass. This triggers the battery paradox: a heavy-lift UAV spends up to 60-70% of its total energy capacity simply carrying the weight of its own power pack, limiting flight times to narrow 10–20 minute cycles.</p><p>Exorbitant battery costs, often reaching up to half of the drone's total price tag, coupled with hours of charging downtime, completely shatter the commercial viability of autonomous logistic hubs.</p>",
                sec3: "<p><b>Weight Optimization & Continuous Operational Cycles:</b> The EnergaTor approach completely restructures the airborne power architecture of industrial UAVs. Instead of attempting to drive flight rotors purely via compressed air expansion or relying on oversized lithium modules, the system implements a buffer power generation cycle.</p><p>The massive primary battery pack is completely eliminated from the drone frame. It is replaced with a downsized, lightweight high-discharge battery that provides necessary peak current to the flight motors. Throughout the flight profile, the onboard Toroidal Transforming Unit (PTU) continuously trickle-charges this lightweight battery block utilizing compressed air energy from cylinders stabilized by integrated heat exchangers.</p><p>Consequently, the downsized battery never drops to zero during mission profiles. Upon landing, the drone bypasses multi-hour electrical plug-in charging: the operator refuels the storage cylinders with compressed air within 3–5 minutes via quick-release couplings, allowing the lightweight aircraft to instantly return to its flight route.</p>"
            },
            de: {
                back: "← Zur Matrix",
                titles: { main: "EnergaTor — Luftfahrttechnologien", sec1: "Operativer Engpass von Lithium-Ionen-Systemen in Drohnen", sec2: "Vergleichsanalyse der Parameter von Bordsystemen", sec3: "EnergaTor-Ingenieurlösung: Leichtbau-Rahmen mit PTU-Pufferung" },
                table: {
                    headers: ["Effizienzparameter", "Standard Lithium-Ionen-Rahmen", "Integrierter EnergaTor PTU-Rahmen"],
                    rows: [
                        ["Gewichtsanteil des Energieblocks", "Bis zu 35-45% des gesamten Leergewichts der Drohne", "Minimal (Batteriegewicht um das Vielfache reduziert)"],
                        ["Energie-Wiederherstellungszeit", "1 bis 4 Stunden kontinuierliche Ladezeit an der Steckdose", "3–5 Minuten (Schnelle Betankung mit Druckluft)"],
                        ["Lebensdauer des Bordspeichers", "Nur 300–400 Zyklen aufgrund hoher Anlaufströme", "Über 20 Jahre Betriebsdauer der mechanischen Kaskaden"],
                        ["Betrieb bei Temperaturen unter -15 °C", "Kritischer Verlust von... bis zu 35% Kapazität und Leistung", "Stabiler Betrieb dank Kältemittel-Thermostabilisierung"]
                    ]
                },
                sec1: "<p>Die moderne Industrie von Industriedrohnen und Flugtaxis (eVTOL) ist an die harten physischen Grenzen chemischer Stromquellen gestoßen. Je schwerer eine Drohne ist, desto massivere Batterieblöcke müssen verbaut werden. Das führt zum Batterie-Paradoxon: Eine schwere Industriedrohne verbraucht den Großteil ihrer Energie nur dafür, das Eigengewicht der Batterie zu tragen, was die Flugzeit auf kurze Intervalle von 10–20 Minuten begrenzt.</p><p>Der hohe Preis der Batterien, der bis zu der Hälfte der Gesamtkosten des Fluggeräts ausmacht, zerstört in Kombination mit den langen Ausfallzeiten beim Laden die wirtschaftliche Rentabilität von Logistik-Hubs vollständig.</p>",
                sec3: "<p><b>Gewichtsoptimierung & kontinuierlicher Arbeitszyklus:</b> Das EnergaTor-Konzept formatiert das Bordnetz schwerer Drohnen komplett um. Anstatt zu versuchen, die Rotoren ausschließlich mit Druckluft zu betreiben oder überdimensionierte Lithium-Kassetten zu verwenden, implementiert das System das Prinzip der Pufferladung.</p><p>Die schwere Hauptbatterie wird vollständig vom Bord der Drohne entfernt. An ihre Stelle tritt eine verkleinerте, leichte Batterie, die die notwendige Spitzenleistung an die Motoren liefert. Während des gesamten Fluges lädt das bordeigene Toroidale Transformationsaggregat (PTU) diesen verkleinerten Speicher kontinuierlich mit der Energie der Druckluft aus den Flaschen auf, die durch ein System von Wärmetauschern stabilisiert werden.</p><p>Dadurch entlädt sich die verkleinerte Batterie während der Mission nie auf Null. Nach der Landung entfällt das stundenlange Laden am Netz: Der Bediener betankt die Flaschen innerhalb von 3–5 Minuten über Schnellkupplungen mit Druckluft, und das Leichtbaugerät kehrt sofort auf die Flugroute zurück.</p>"
            }
        };

        let currentLang = localStorage.getItem('energator_lang') || 'ua';

        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('energator_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                if (btn.id === `btn-${lang}`) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const trans = aeroTranslations[lang] || aeroTranslations['ua'];
            
            document.getElementById('lnBack').innerText = trans.back;
            document.getElementById('pageTitle').innerText = trans.titles.main;
            document.getElementById('sec1Title').innerText = trans.titles.sec1;
            document.getElementById('sec2Title').innerText = trans.titles.sec2;
            document.getElementById('sec3Title').innerText = trans.titles.sec3;
            
            document.getElementById('sec1Content').innerHTML = trans.sec1;
            document.getElementById('sec3Content').innerHTML = trans.sec3;

            // Рендеринг таблицы
            const headerRow = document.getElementById('tableHead');
            headerRow.innerHTML = `<th>${trans.table.headers[0]}</th><th>${trans.table.headers[1]}</th><th>${trans.table.headers[2]}</th>`;
            
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = "";
            trans.table.rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><strong>${row[0]}</strong></td><td>${row[1]}</td><td>${row[2]}</td>`;
                tableBody.appendChild(tr);
            });
        }

        changeLang(currentLang);
    </script>
