<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ЭнергаТор — Технология ТСА</title>
    <style>
        body { margin: 0; background: #0a0f1d; font-family: sans-serif; color: white; overflow-x: hidden; }
        canvas { display: block; }
        .hero-content {
            position: absolute; top: 15%; width: 100%; text-align: center; z-index: 10; pointer-events: none;
        }
        h1 { color: #d4af37; font-size: 3.5rem; margin: 0; text-transform: uppercase; letter-spacing: 5px; }
        p { font-size: 1.2rem; color: #94a3b8; max-width: 600px; margin: 20px auto; line-height: 1.6; }
        .nav-btn {
            pointer-events: auto; padding: 15px 40px; border: 2px solid #d4af37; color: #d4af37;
            text-decoration: none; font-weight: bold; transition: 0.3s; background: rgba(0,0,0,0.5);
        }
        .nav-btn:hover { background: #d4af37; color: #0a0f1d; }
    </style>
</head>
<body>

    <div class="hero-content">
        <h1>ЭнергаТор</h1>
        <p>Тороидальный силовой агрегат (ТСА): Бесконтактная магнитная передача энергии. Нулевое трение, максимальный ресурс.</p>
        <a href="#intelligence" class="nav-btn">АНАЛИТИЧЕСКИЙ ХАБ</a>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Освещение
        const light = new THREE.PointLight(0xd4af37, 1, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // 1. Баллоны (Цилиндры)
        const tankGeo = new THREE.CylinderGeometry(0.5, 0.5, 3, 32);
        const tankMat = new THREE.MeshPhongMaterial({ color: #1e293b, transparent: true, opacity: 0.7 });
        
        const tank1 = new THREE.Mesh(tankGeo, tankMat);
        tank1.position.set(-5, 0, 0);
        scene.add(tank1);

        const tank2 = new THREE.Mesh(tankGeo, tankMat);
        tank2.position.set(5, 0, 0);
        scene.add(tank2);

        // 2. ТСА (Тороид)
        const torusGeo = new THREE.TorusGeometry(2, 0.4, 16, 100);
        const torusMat = new THREE.MeshPhongMaterial({ color: 0x334155, transparent: true, opacity: 0.4, wireframe: true });
        const tca = new THREE.Mesh(torusGeo, torusMat);
        tca.rotation.x = Math.PI / 2;
        scene.add(tca);

        // 3. Маховик (Внешний диск над тороидом)
        const wheelGeo = new THREE.TorusGeometry(2.5, 0.1, 16, 100);
        const wheelMat = new THREE.MeshPhongMaterial({ color: 0xd4af37 });
        const flywheel = new THREE.Mesh(wheelGeo, wheelMat);
        flywheel.rotation.x = Math.PI / 2;
        flywheel.position.y = 0.5; // Расположен чуть выше тороида
        scene.add(flywheel);

        // 4. Поршень (Маленькая сфера внутри тора)
        const pistonGeo = new THREE.SphereGeometry(0.3, 32, 32);
        const pistonMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0xd4af37 });
        const piston = new THREE.Mesh(pistonGeo, pistonMat);
        scene.add(piston);

        camera.position.z = 8;
        camera.position.y = 3;
        camera.lookAt(0,0,0);

        let angle = 0;
        function animate() {
            requestAnimationFrame(animate);
            
            angle += 0.02;
            
            // Движение поршня по кругу внутри тора
            piston.position.x = 2 * Math.cos(angle);
            piston.position.z = 2 * Math.sin(angle);
            
            // Синхронное вращение маховика (магнитная связь)
            flywheel.rotation.z = -angle; 
            
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
