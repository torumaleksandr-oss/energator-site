                },
                sec1: "<p>Сучасний міський та комерційний транспорт перебуває під зростаючим тиском одразу кількох факторів. Посилення екологічних вимог, зростання вартості палива та електроенергії, дефіцит потужностей розподільних мереж, а також висока вартість тягових акумуляторів змушують транспортні компанії шукати нові підходи. Сьогодні більшість рішень заснована або на двигунах внутрішнього згоряння, або на повністю акумуляторному електроприводі. Кожна з цих концепцій має свої жорсткі обмеження.</p><p>Використання викопного палива супроводжується зростанням експлуатаційних витрат та збільшенням екологічного навантаження, тоді як акумуляторний міський транспорт зіткнувся із системними експлуатаційними та інфраструктурними бар'єрами:</p><ul><li><b>Кліматичний провал:</b> При падінні температури повітря нижче -10 °C реальний запас ходу електробусів скорочується на 40–50%. Охолодження АКБ поєднується з колосальним енергоспоживанням систем опалення салону, викликаючи зриви графіків.</li><li><b>Деградація ячеєк у режимі старт-стоп:</b> Високі пускові струми при розгоні багатотонної машини викликають небезпечний перегрів акумуляторів, а потужні імпульсні струми рекуперації при частих гальмуваннях призводять до втрати ємності вже через 3–5 років.</li><li><b>Інфраструктурний тупик:</b> Станції ультрашвидкої зарядки (пантографи) вимагають від 1 до 3.5 МВт на один пост. Підключення навіть невеликого парку створює критичні пікові навантаження на муніципальні електромережі та вимагає мільйонних капітальних вкладень (CAPEX).</li></ul>",

го місця паркування. Це забезпечує граничну простоту та зниження стартової вартості машини (CAPEX) при стабільній швидкості.</p><p><b>Муніципальні переваги та інтеграція з мережею:</b> Заправка бортових балонів займає від 5 до 10 хвилин, повертаючи машину на маршрут у режимі 24/7. Енергія стиснення та розширення повітря, а також циркуляція рідини в контурі дозволяють використовувати розподілене тепло і холод для клімат-контролю салону без додаткового виснаження АКБ. Наземні станції заправки накопичують повітря в стаціонарних каскадах у плавному цілодобовому режимі (наприклад, за нічним тарифом або від ВДЕ), що мінімізує мегаваттні удари по мережах. Дана екологічна екосистема не протиставляється централізованій енергетиці, а підвищує її стійкість та знижує пікові навантаження.</p>"

                },
                sec1: "<p>Современный городской и коммерческий транспорт находится под растущим давлением сразу нескольких факторов. Ужесточение экологических требований, рост стоимости топлива и электроэнергии, дефицит мощностей распределительных сетей, а также высокая стоимость тяговых аккумуляторов заставляют транспортные компании искать новые подходы. Сегодня большинство решений основано либо на двигателях внутреннего сгорания, либо на полностью аккумуляторном электроприводе. Каждая из этих концепций имеет свои жесткие ограничения.</p><p>Использование ископаемого топлива сопровождается ростом эксплуатационных расходов и увеличением экологической нагрузки, тогда как аккумуляторный городской транспорт столкнулся с системными эксплуатационными и инфраструктурными барьерами:</p><ul><li><b>Климатический провал:</b> При падении температуры воздуха ниже -10 °C реальный запас хода электробусов сокращается на 40–50%. Охлаждение АКБ сочетается с колоссальным энергопотреблением систем отопления салона, вызывая срывы графиков.</li><li><b>Деградация ячеек в режиме старт-стоп:</b> Высокие пусковые токи при разгоне многотонной машины вызывают опасный перегрев аккумуляторов, а мощные импульсные токи рекуперации при частых торможениях приводят к потере емкости уже через 3–5 лет.</li><li><b>Инфраструктурный тупик:</b> Станции ультрабыстрой зарядки (пантографы) требуют от 1 до 3.5 МВт на один пост. Подключение даже небольшего парка создает критические пиковые нагрузки на муниципальные электросети и требует миллионных капитальных вложений (CAPEX).</li></ul>",
                sec3: "<p>Концепция «ЭнергаТор» предлагает альтернативный подход, основанный на использовании сжатого воздуха как долговременного накопителя энергии в сочетании с высокоэффективной системой её преобразования непосредственно на борту. Энергетическим ядром системы является связка ТПА + Генератор. Тороидальный преобразующий агрегат через СОЖ преобразует кинетическую энергию сжатого воздуха в стабильный крутящий момент. Генератор, управляемый интеллектуальной электронной системой, обеспечивает непрерывное и плавное питание тяговых электродвигателей. Энергетическое ядро формирует электроэнергию по мере необходимости, что позволяет значительно уменьшить требования к ёмкости буферной АКБ.</p><p>Для адаптации к специфике городского движения ЭнергаТор предлагает два варианта исполнения бортовой платформы:</p><h3>Опция А. Пневмо-электрический HESS-контур (Для интенсивного городского трафика)</h3><p>Конфигурация сочетает в себе ТПА, легкий генератор, блок суперконденсаторов и оптимизированную уменьшенную буферную АКБ. В моменты интенсивного торможения тяговые электродвигатели генерируют мощный импульс рекуперации, который мгновенно поглощается суперконденсаторами, сохраняя до 40% кинетической энергии. При старте с места они мгновенно отдают этот ток для силового рывка машины. Химическая буферная АКБ полностью изолирована от разрушительных токов, а ТПА в фоновом режиме непрерывно восполняет базовый баланс энергии. Опция обеспечивает максимальный ресурс оборудования в рваном ритме города.</p><h3>Опция Б. Прямой последовательный гибрид (Для городских и пригородных регулярных маршрутов)</h3><p>Конфигурация включает в себя ТПА, генератор и компактную тяговую буферную АКБ (без суперконденсаторов). Ток от генератора ТПА через электронный блок инвертора направляется напрямую на обмотки тяговых электродвигателей. Компактная АКБ используется для сглаживания стандартных нагрузок. В случае сбоя или падения давления, емкости буферной АКБ гарантированно хватает на 5–10 минут автономного хода, чтобы безопасно отвести машину с проезжей части или доехать до ближайшего места парковки. Это обеспечивает предельную простоту и снижение стартовой стоимости машины (CAPEX) при стабильной скорости.</p><p><b>Муниципальные преимущества и интеграция с сетью:</b> Заправка бортовых баллонов занимает от 5 до 10 минут, возвращая машину на маршрут в требуемом режиме 24/7. Энергия сжатия и расширения воздуха, а также циркуляция жидкости в контуре позволяют использовать распределенное тепло и холод для климат-контроля салона без дополнительного истощения АКБ. Наземные станции заправки накапливают воздух в стационарных каскадах в плавном круглосуточном режиме (например, по ночному тарифу или от ВИЭ), что минимизирует мегаваттные удары по сетям. Данная экологическая экосистема не противопоставляется централизованной энергетике, а повышает её устойчивость и снижает пиковые нагрузки.</p>"
            },
            en: {
                back: "← To Matrix",
                titles: { main: "EnergaTor — Municipal & Commercial Transit", sec1: "Energy Crisis of Commercial and Municipal Electric Vehicles", sec2: "Comparative Analysis of Operational Parameters", sec3: "EnergaTor Engineering Platform: Integration Options" },
                table: {
                    headers: ["Efficiency Parameter", "Standard EV Bus (BESS)", "EnergaTor Transit Platform"],
                    rows: [
                        ["Useful Vehicle Payload", "Slashed significantly due to massive heavy battery weights", "Maximum efficiency (onboard system mass minimized)"],
                        ["Route Operational Downtime", "Hours of absolute grid dependency at slow or rapid plug terminals", "Storage cylinder air refueling complete within 5–10 min"],
                        ["Storage System Lifespan", "Mere 300–400 cycles under heavy startup and regen currents", "Free from degradation constraints typical of chemical batteries"],
                        ["Cabin Climate Stability", "Loss of up to 40-50% operational range due to winter heating loads", "Stable performance secured below -15 °C and above 35 °C bounds"]
                    ]
                },
                sec1: "<p>Modern urban and commercial transit is facing immense pressure from multiple compounding factors. Tightening environmental regulations, escalating fuel and electricity costs, grid distribution capacity limits, and exorbitant traction battery expenses force fleet operators to seek new approaches. Today, most options rely either on fossil fuel ICEs or pure battery electric powertrains. Both concepts present severe operational dead-ends.</p><p>Fossil fuel utilization guarantees rising OPEX and heavy ecological fines, while battery-powered municipal transit has run directly into structural and infrastructural barriers:</p><ul><li><b>Climate Failure:</b> When temperatures plunge below -10 °C, the real-world driving range of pure EVs drops by 40–50% due to battery freezing combined with massive cabin heating power demands, breaking schedule intervals.</li><li><b>Cell Degradation under Stop-and-Go Cycles:</b> High startup currents during heavy multi-ton vehicle acceleration trigger extreme internal heat build-up, while powerful regeneration spikes during frequent braking ruin capacity within 3–5 years.</li><li><b>Infrastructure Bottleneck:</b> Ultra-fast charging stations require 1 to 3.5 MW of dedicated capacity per single dock. Implementing this for even a small fleet overloads municipal grids and demands millions in CAPEX.</li></ul>",
                sec3: "<p>The EnergaTor concept delivers an alternative approach utilizing compressed air as a long-term energy storage medium coupled with highly efficient onboard conversion. The power core consists of a PTU + Generator setup. The Toroidal Transforming Unit transforms compressed air potential energy via working fluid into stable torque. The generator, governed by an intelligent electronic matrix, provides continuous, smooth power to the traction motors, generating electricity on demand and slashing buffer battery capacity needs.</p><p>To adapt to volatile urban transit profiles, EnergaTor offers two distinct onboard platform options:</p><h3>Option A. Pneumatic-Electric HESS Circuit (For Heavy Stop-and-Go Urban Routes)</h3><p>This layout integrates the PTU, a lightweight generator, a supercapacitor block, and a downsized buffer battery. During heavy braking, the traction motors generate massive regeneration energy spikes, instantly absorbed by the supercapacitors, capturing up to 40% of kinetic energy. Upon acceleration, they instantly discharge this energy for a powerful launch. The chemical buffer battery remains fully insulated from destructive peak loads, while the PTU handles baseline energy replenishment, maximizing system lifespan.</p><h3>Option B. Direct Series Hybrid (For Suburban and Scheduled Fixed-Speed Lines)</h3><p>This layout features the PTU, a generator, and a compact traction buffer battery without supercapacitors. Current from the PTU generator routes directly to the motor inverters through an electronic control system. The compact battery handles minor voltage smoothing and serves as an emergency backup. If a pressure drop occurs, the buffer battery secures 5–10 minutes of autonomous range, enough to clear the roadway safely or reach a parking zone. This option delivers extreme design simplicity and lower vehicle CAPEX.</p><p><b>Municipal Benefits & Grid Integration:</b> Onboard cylinder refueling takes only 5–10 minutes, securing 24/7 fleet availability. Expansion thermal properties and fluid circulation allow the capture of free heating and cooling for cabin climate control without depleting the battery. Micro-grids accumulate air within ground cascades in a smooth, continuous 24-hour cycle (via off-peak night tariffs or local renewables), completely eliminating megawatt-level grid shocks. This ecosystem supports central grids, acting as a vital peak-shaving tool.</p>"
            },
            de: {
                back: "← Zur Matrix",
                titles: { main: "EnergaTor — Kommunaler & Kommerzieller Verkehr", sec1: "Energiekrise des kommerziellen und kommunalen Elektroverkehrs", sec2: "Vergleichsanalyse der Betriebsparameter", sec3: "EnergaTor-Ingenieurlösung: Serielle Hybridarchitektur" },
                table: {
                    headers: ["Effizienzparameter", "Standard-Elektrobus (BESS)", "EnergaTor-Transportplattform"],
                    rows: [
                        ["Nutzlast der Plattform", "Erheblich reduziert durch das enorme Gewicht schwerer Batterien", "Maximal (Gewicht des Bordsystems minimiert)"],
                        ["Ausfallzeiten auf der Linie", "Stundenlanges Warten an der Steckdose oder an Schnellladestationen", "Druckluftbetankung der Flaschen in 5–10 Minuten"],
                        ["Lebensdauer des Speichers", "Nur 300–400 Zyklen aufgrund hoher Anlauf- und Rekuperationsströme", "Frei von den zyklischen Verschleißgrenzen chemischer Zellen"],
                        ["Klimatische Stabilität des Salons", "Verlust von bis zu 40-50% der Reichweite im Winter durch Heizung", "Stabiler Betrieb unter -15 °C und über 35 °C gesichert"]
                    ]
                },
                sec1: "<p>Der moderne städtische und kommerzielle Verkehr steht unter dem wachsenden Druck mehrerer Faktoren. Strengere Umweltauflagen, steigende Kraftstoff- und Stromkosten, Kapazitätsенгpässe der Verteilungsnetze und hohe Kosten für Traktionsbatterien zwingen Transportunternehmen zum Umdenken. Heute basieren die meisten Lösungen entweder auf Verbrennungsmotoren oder rein batterieelektrischen Antrieben. Beide Konzepte weisen gravierende operative Grenzen auf.</p><p>Die Nutzung fossiler Brennstoffe führt zu steigenden Betriebskosten und hoher Umweltbelastung, während der batteriebetriebene Stadtverkehr auf systemische Barrieren stößt:</p><ul><li><b>Klimatischer Einbruch:</b> Bei Temperaturen unter -10 °C sinkt die reale Reichweite von Elektrobussen um 40–50%. Die Abkühlung der Batterie kombiniert mit dem enormen Stromverbrauch der Fahrgastraumbelüftung führt zu Fahrplanausfällen.</li><li><b>Zelldegradation im Stop-and-Go-Betrieb:</b> Hohe Anlaufströme beim Beschleunigen tonnenschwerer Fahrzeuge verursachen eine gefährliche Überhitzung der Batterien, während starke Impulsströme bei häufigem Bremsen die Kapazität bereits nach 3–5 Jahren ruinieren.</li><li><b>Infrastruktur-Sackgasse:</b> Ultraschnellladestationen (Pantografen) erfordern 1 bis 3,5 MW pro Ladesäule. Der Anschluss selbst einer kleinen Flotte verursacht kritische Spitzenlasten im städtischen Stromnetz und erfordert millionenschwere Investitionen (CAPEX).</li></ul>",
                sec3: "<p>Das EnergaTor-Konzept bietet einen alternativen Ansatz, der auf der Nutzung von Druckluft als Langzeitspeichermedium in Kombination mit einer hocheffizienten On-Board-Transformation basiert. Der Kern des Systems ist eine PTU + Generator-Einheit. Das Aggregat wandelt Druckluftenergie über das Arbeitsmedium in ein stabiles Drehmoment um. Der Generator speist die Elektromotoren kontinuierlich und reibungslos über ein elektronisches Steuerungssystem und reduziert so die Anforderungen an die Pufferbatterie drastisch.</p><p>Für die spezifischen Anforderungen des Stadtverkehrs bietet EnergaTor zwei Plattformoptionen an:</p><h3>Option A. Pneumatisch-Elektrischer HESS-Kreislauf (Für dichten innerstädtischen Stop-and-Go-Verkehr)</h3><p>Diese Konfiguration kombiniert die PTU, einen Leichtbaugenerator, einen Superkondensatorenblock und eine optimierte Pufferbatterie. Beim starken Bremsen erzeugen die Motoren einen starken Rekuperationsimpuls, der sofort von den Superkondensatoren absorbiert wird und bis zu 40% der kinetischen Energie speichert. Beim Anfahren geben sie diesen Strom sofort für die Beschleunigung ab. Die chemische Pufferbatterie bleibt von den zerstörerischen Spitzenströmen vollständig isoliert, während die PTU die Basisenergie kontinuierlich nachlädt. Dies sichert eine maximale Lebensdauer im dichten Stadtverkehr.</p><h3>Option B. Direkter Serieller Hybrid (Für Vorort- und Linienverkehr mit gleichmäßiger Geschwindigkeit)</h3><p>Diese Konfiguration umfasst die PTU, einen Generator und eine kompakte Pufferbatterie ohne Superkondensatoren. Der Strom aus dem PTU-Generator fließt über den Wechselrichter direkt zu den Motoren. Die kompakte Batterie dient zur Glättung von Standardlasten. Bei einem Systemausfall reicht die Kapazität der Pufferbatterie garantiert für 5–10 Minuten autonomen Fahrbetriebs aus, um das Fahrzeug sicher von der Fahrbahn zu entfernen oder den nächsten Parkplatz anzusteuern. Dies bietet maximale Konstruktionsinfachheit und senkt die CAPEX des Fahrzeugs.</p><p><b>Kommunale Vorteile & Netzintegration:</b> Die Betankung der Flaschen dauert nur 5–10 Minuten und sichert eine 24/7-Flottenverfügbarkeit. Die thermischen Eigenschaften der Luftexpansion ermöglichen die Nutzung von Wärme und Kälte für die Klimatisierung des Innenraums, ohne die Batterie zu belasten. Bodenstationen speichern Luft in Kaskaden rund um die Uhr (z. B. zu günstigen Nachttarifen oder aus erneuerbaren Energien), wodurch Megawatt-Spitzen im Netz vermieden werden. Dieses System unterstützt die zentrale Energieversorgung direkt als Peak-Shaving-Werkzeug.</p>"
            }
        };
